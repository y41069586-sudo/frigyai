name: FrigyNative
options:
  bundleIdPrefix: com.frigyapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  ChottuLinkSDK:
    url: https://github.com/ConnectingDotsInfotech/chottulink-ios-sdk
    from: 1.1.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.29.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    # 9.0.0 added the signIn(...nonce:...) overload our nonce-verification fix in
    # SupabaseAuthService.signInWithGoogle() depends on; 8.0.0 doesn't have it at all.
    from: 9.0.0

settings:
  base:
    # Swift 5 language mode: the iOS 26 SDK (incl. Liquid Glass) and all app
    # behavior are unchanged, but Swift 6's complete data-race checking — which
    # turns every UIKit/Capacitor delegate-bridging concurrency mismatch into a
    # hard build error ("sending ... risks data races", "@MainActor conformance
    # crosses ...") — is relaxed to warnings. This stops the recurring archive
    # failures. Revisit (back to "6.0") only after the native bridging code is
    # fully audited for Sendable/actor isolation.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Required for App Store archive: build all slices (arm64 + arm64e), not just
    # the active architecture of the build host.
    ONLY_ACTIVE_ARCH: NO
    # Explicit Modules (SwiftExplicitDependencyGeneratePcm build steps) has
    # repeatedly hung the CodeMagic archive build indefinitely — with zero log
    # output — while precompiling plain Apple system frameworks (HealthKit,
    # Metal, UIKit, ...), unrelated to any app code. Falling back to the older,
    # more battle-tested implicit module system trades a little build speed for
    # the archive actually completing instead of hanging forever.
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    CLANG_ENABLE_EXPLICIT_MODULES: NO
    # Explicit module dependencies to avoid module cache corruption
    CLANG_ENABLE_MODULES: YES
    CLANG_MODULES_AUTOLINK: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES

targets:
  FrigyNative:
    type: application
    platform: iOS
    sources:
      - path: FrigyNative
        excludes:
          - "**/*.example"
          - public/**
          - capacitor.config.json
          - Capacitor/**
    resources:
      - path: FrigyNative/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frigyapp.app
        INFOPLIST_FILE: FrigyNative/Info.plist
        CODE_SIGN_ENTITLEMENTS: FrigyNative/FrigyNative.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 506
        MARKETING_VERSION: 1.0.0
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: ChottuLinkSDK
        product: ChottuLinkSDK
      - package: Supabase
        product: Supabase
      - package: Supabase
        product: Auth
      - package: RevenueCat
        product: RevenueCat
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: FrigyNative/Info.plist
      properties:
        CFBundleDisplayName: Frigy
        CFBundleURLTypes:
          - CFBundleURLName: com.frigyapp.app
            CFBundleURLSchemes:
              - frigy
          - CFBundleURLName: google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.153158265512-8ookf1g41bc74527pqh66ufga6uatrlm
        UILaunchScreen: {}
        # iPhone: portrait only (food-tracking UX is vertical)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Supabase + OAuth — values injected by Secrets.xcconfig on Codemagic
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        APP_WEB_HOST: "$(APP_WEB_HOST)"
        OAUTH_REDIRECT_SCHEME: "$(OAUTH_REDIRECT_SCHEME)"
        OAUTH_CALLBACK_HOST: "$(OAUTH_CALLBACK_HOST)"
        REVENUECAT_API_KEY: "$(REVENUECAT_API_KEY)"
        REVENUECAT_ENTITLEMENT_ID: "$(REVENUECAT_ENTITLEMENT_ID)"
        # Paywall bypass for dev/tester accounts — value injected by Secrets.xcconfig.
        # MUST be declared here: XcodeGen regenerates Info.plist on every Codemagic
        # build, so a key present only in the checked-in Info.plist would be dropped.
        PAYWALL_BYPASS_EMAILS: "$(PAYWALL_BYPASS_EMAILS)"
        # Usage descriptions — required by App Store Review (German: app primary language)
        NSHealthShareUsageDescription: "Frigy liest deine Schritte und aktiven Kalorien aus der Gesundheits-App, um deinen Netto-Kalorienverbrauch zu berechnen."
        NSHealthUpdateUsageDescription: "Frigy schreibt keine Gesundheitsdaten. Dieser Text ist aus technischen Gründen erforderlich."
        NSCameraUsageDescription: "Frigy braucht die Kamera, um Barcodes zu scannen und Fotos deiner Mahlzeiten für die KI-Analyse aufzunehmen."
        NSPhotoLibraryUsageDescription: "Wähle Fotos deiner Mahlzeiten aus der Bibliothek aus, damit Frigy die Nährwerte per KI berechnen kann."
        NSUserNotificationsUsageDescription: "Frigy sendet dir Erinnerungen für deine Mahlzeiten und Fortschritts-Updates."
        UIBackgroundModes:
          - remote-notification
        # Export compliance — app uses HTTPS/TLS only, no proprietary encryption
        ITSAppUsesNonExemptEncryption: false
        # Allow WKWebView to load local bundle resources (needed if Capacitor is ever re-enabled)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  FrigyNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FrigyNativeTests
    dependencies:
      - target: FrigyNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frigyapp.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FrigyNative:
    build:
      targets:
        FrigyNative: all
        FrigyNativeTests: [test]
    test:
      targets:
        - FrigyNativeTests
