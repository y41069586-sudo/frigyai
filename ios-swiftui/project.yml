name: FrigyNative
options:
  bundleIdPrefix: com.frigyapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  ChottuLinkSDK:
    url: https://github.com/ConnectingDotsInfotech/chottulink-ios-sdk
    from: 1.1.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.29.0

settings:
  base:
    # Swift 5 language mode: the iOS 26 SDK (incl. Liquid Glass) and all app
    # behavior are unchanged, but Swift 6's complete data-race checking — which
    # turns every UIKit/Capacitor delegate-bridging concurrency mismatch into a
    # hard build error ("sending ... risks data races", "@MainActor conformance
    # crosses ...") — is relaxed to warnings. This stops the recurring archive
    # failures. Revisit (back to "6.0") only after the native bridging code is
    # fully audited for Sendable/actor isolation.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Required for App Store archive: build all slices (arm64 + arm64e), not just
    # the active architecture of the build host.
    ONLY_ACTIVE_ARCH: NO
    # Explicit module dependencies to avoid module cache corruption
    CLANG_ENABLE_MODULES: YES
    CLANG_MODULES_AUTOLINK: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    # Enable whole module optimization for Release builds only (set in config files)
    GCC_OPTIMIZATION_LEVEL: 3

targets:
  FrigyNative:
    type: application
    platform: iOS
    sources:
      - path: FrigyNative
        excludes:
          - "**/*.example"
          - public/**
          - capacitor.config.json
          - Capacitor/**
    resources: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frigyapp.app
        INFOPLIST_FILE: FrigyNative/Info.plist
        CODE_SIGN_ENTITLEMENTS: FrigyNative/FrigyNative.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: ChottuLinkSDK
        product: ChottuLinkSDK
      - package: Supabase
        product: Supabase
      - package: Supabase
        product: Auth
    info:
      path: FrigyNative/Info.plist
      properties:
        CFBundleDisplayName: Frigy
        CFBundleURLTypes:
          - CFBundleURLName: com.frigyapp.app
            CFBundleURLSchemes:
              - frigy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Frigy uses the camera to recognize ingredients in your fridge and pantry."
        NSPhotoLibraryUsageDescription: "Frigy can analyze photos from your gallery to recognize ingredients."
        NSUserNotificationsUsageDescription: "Frigy sends optional reminders for meals, water, and your goals."
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false

  FrigyNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FrigyNativeTests
    dependencies:
      - target: FrigyNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frigyapp.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FrigyNative:
    build:
      targets:
        FrigyNative: all
        FrigyNativeTests: [test]
    test:
      targets:
        - FrigyNativeTests
