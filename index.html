  <body>
    <div id="root"></div>

    <script>
      (function () {
        // Dev (Vite): kein SW-Recovery — verhindert schwarzen/leeren Preview bei localhost
        if (/localhost|127\.0\.0\.1/.test(location.hostname) && !/^\?.*pwa=/i.test(location.search)) {
          return;
        }

        const FLAG = "fb_sw_recovered";
        const MAX_RECOVERY_ATTEMPTS = 2;
        let recoveryAttempts = parseInt(sessionStorage.getItem("fb_recovery_count") || "0");

        // Check if we've already tried recovering
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has("recovered")) {
          const recoveredTime = parseInt(urlParams.get("recovered") || "0");
          if (Date.now() - recoveredTime < 15000) {
            // We recovered recently, don't try again
            console.log("[Frigy] Recent recovery detected, skipping further recovery attempts");
            return;
          }
        }

        async function recover(reason) {
          try {
            if (sessionStorage.getItem(FLAG)) return;

            recoveryAttempts++;
            if (recoveryAttempts > MAX_RECOVERY_ATTEMPTS) {
              console.error("[Frigy] Max recovery attempts reached");
              return;
            }

            sessionStorage.setItem("fb_recovery_count", String(recoveryAttempts));
            sessionStorage.setItem(FLAG, "1");

            console.warn("[Frigy] Cache-Recovery gestartet (Versuch " + recoveryAttempts + "):", reason);

            if ("serviceWorker" in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map((r) => r.unregister()));
            }

            if ("caches" in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            }
          } catch (e) {
            console.warn("[Frigy] Cache-Recovery Fehler (ignoriert):", e);
          } finally {
            const url = new URL(window.location.href);
            url.searchParams.set("recovered", String(Date.now()));
            setTimeout(() => {
              window.location.replace(url.toString());
            }, 2000);
          }
        }

        function shouldRecover(msg, source) {
          const m = String(msg || "");
          const s = String(source || "");

          // Ignore Fast Refresh errors - they don't require recovery
          if (/Fast Refresh/i.test(m) || /Could not Fast Refresh/i.test(m)) {
            return false;
          }

          // Common PWA/chunk mismatch messages across browsers
          const patterns = [
            /Importing a module script failed/i,
            /Failed to fetch dynamically imported module/i,
            /Failed to load module script/i,
            /Loading module from/i,
            /disallowed MIME type/i,
            /MIME type/i,
          ];

          if (patterns.some((p) => p.test(m))) return true;

          // Often indicates an old index.html pointing to a non-existent chunk
          if (/Unexpected token\s*'</i.test(m) && /\/assets\//i.test(s)) return true;

          return false;
        }

        window.addEventListener(
          "error",
          (e) => {
            const msg = String(e?.message || e?.error?.message || "");
            const source = String(e?.filename || e?.error?.stack || "");
            if (shouldRecover(msg, source)) recover({ type: "error", msg, source });
          },
          true
        );

        window.addEventListener(
          "unhandledrejection",
          (e) => {
            const msg = String(e?.reason?.message || e?.reason || "");
            const source = String(e?.reason?.stack || "");
            if (shouldRecover(msg, source)) recover({ type: "unhandledrejection", msg, source });
          },
          true
        );
      })();
    </script>
