apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.frigy.app"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            def cmKeystorePath = System.getenv("CM_KEYSTORE_PATH")
            if (cmKeystorePath != null && file(cmKeystorePath).exists()) {
                // Codemagic: injected when Android keystore is configured (Team → Code signing)
                storeFile file(cmKeystorePath)
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            } else if (keystorePropertiesFile.exists()) {
                // Local release builds: android/keystore.properties (see keystore.properties.example)
                def storeFilePath = keystoreProperties['storeFile']
                if (storeFilePath != null) {
                    storeFile file(storeFilePath)
                }
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId "com.frigyapp.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

// Google Play rejects debug-signed bundles — fail fast instead of silently using debug keys.
gradle.taskGraph.whenReady { taskGraph ->
    def isReleaseArtifactTask = taskGraph.allTasks.any { task ->
        task.name ==~ /(?i).*(bundle|assemble)Release.*/
    }
    if (!isReleaseArtifactTask) {
        return
    }
    def releaseSigning = android.signingConfigs.release
    def store = releaseSigning.storeFile
    if (store == null || !store.exists()) {
        throw new GradleException(
            "Release signing is not configured — Google Play rejects debug-signed AAB/APK.\n\n" +
            "Codemagic: Team settings → Code signing identities → Android keystore (reference: frigy_release).\n" +
            "           codemagic.yaml must list android_signing: [frigy_release], then rebuild.\n\n" +
            "Local: cp android/keystore.properties.example android/keystore.properties,\n" +
            "       create a release .keystore, fill passwords (never commit keystore.properties).\n\n" +
            "See docs/CODEMAGIC.md (section Android) and NATIVE_APP_SETUP.md."
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.chottulink:android-sdk:1.1.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
