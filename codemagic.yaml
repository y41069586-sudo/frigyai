workflows:
  android-build:
    name: Android Build

    max_build_duration: 90

    environment:
      java: 21
      vars:
        NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      # Optional: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
      # Für Updates OHNE Deinstall: in Codemagic → Code signing identities
      # denselben Keystore wie früher (EAS) hochladen, Referenzname: frigy_release
      # android_signing:
      #   - frigy_release

    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor web assets
        script: node scripts/prepare-android-web-assets.mjs

      - name: Build installable Release APK
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../build
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "ERROR: Release APK not found at $APK_SRC"
            find app/build/outputs -name "*.apk" || true
            exit 1
          fi
          cp -f "$APK_SRC" ../build/Frigy.apk
          ls -lh ../build/Frigy.apk
          cat > ../build/INSTALL-HANDY.txt << 'EOF'
          Frigy auf dem Android-Handy installieren
          ======================================

          PAKET-KONFLIKT (alte EAS-APK z.B. application-xxxxx.apk)?
          → Zuerst die alte Frigy/Fridgie-App DEINSTALLIEREN:
            Einstellungen → Apps → Frigy (oder Fridgie) → Deinstallieren
          → Dann Frigy.apk neu installieren.
          (Andere Signatur als früherer EAS-Build — einmalig nötig.)

          1) Frigy.apk vom PC (Codemagic → Artifacts) aufs Handy kopieren.
          2) APK öffnen → ggf. „Unbekannte Apps installieren“ erlauben.
          3) Installieren.

          Ab dann: immer dieselbe Build-Pipeline nutzen, damit Updates drübergehen.
          EOF
          echo "Fertig: build/Frigy.apk (eine Datei, Release-Build)"

    artifacts:
      - build/Frigy.apk
      - build/INSTALL-HANDY.txt

    publishing:
      scripts:
        - name: Download-Hinweis
          script: |
            echo "=========================================="
            echo "  Handy: Artifacts → Frigy.apk herunterladen"
            echo "  Nicht Quick Launch (nur Emulator)"
            echo "  APK per Mail/Drive/USB aufs Handy kopieren"
            echo "=========================================="
