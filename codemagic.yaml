workflows:
  android-build:
    name: Android Build

    max_build_duration: 90

    environment:
      java: 21
      vars:
        NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      # Optional: BUILD_NOTIFY_EMAIL = deine Mail für Download-Link per E-Mail
      # Optional: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY

    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor web assets
        script: node scripts/prepare-android-web-assets.mjs

      - name: Build installable Release APK
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../build
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "ERROR: Release APK not found at $APK_SRC"
            find app/build/outputs -name "*.apk" || true
            exit 1
          fi
          cp -f "$APK_SRC" ../build/Frigy.apk
          ls -lh ../build/Frigy.apk
          cat > ../build/INSTALL-HANDY.txt << 'EOF'
          Frigy auf dem Android-Handy installieren
          ======================================

          1) Frigy.apk aufs Handy kopieren (nicht Quick Launch):
             - Codemagic-Build auf dem PC öffnen → Artifacts → Frigy.apk herunterladen
             - Per USB, Google Drive, WhatsApp oder E-Mail an dich senden

          2) Auf dem Handy die APK-Datei öffnen (Dateien / Downloads).

          3) Falls gefragt: „Unbekannte Apps installieren“ für Dateien/Chrome erlauben.

          4) Installieren → Frigy öffnen.

          Hinweis: „Quick Launch“ in Codemagic ist nur Emulator-Vorschau, kein Handy-Download.
          EOF
          echo "Fertig: build/Frigy.apk (eine Datei, Release-Build)"

    artifacts:
      - build/Frigy.apk
      - build/INSTALL-HANDY.txt

    publishing:
      scripts:
        - name: Download-Hinweis
          script: |
            echo "=========================================="
            echo "  Handy: Artifacts → Frigy.apk herunterladen"
            echo "  Nicht Quick Launch (nur Emulator)"
            echo "  APK per Mail/Drive/USB aufs Handy kopieren"
            echo "=========================================="
