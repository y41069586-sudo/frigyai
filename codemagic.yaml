# Frigy — iOS Build (Capacitor). Setup: docs/CODEMAGIC.md + codemagic.env.example

workflows:
  ios-build:
    name: iOS Build

    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      node: 22
      # Secrets live in Codemagic variable group "frigy" (name must match UI exactly).
      # Alternative: leave Group empty on each variable and remove the groups: block below.
      groups:
        - frigy
      # Upload or generate Distribution cert + App Store profile in Team → Code signing identities first.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.frigyapp.app
      vars:
        NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        XCODE_SCHEME: App
        BUNDLE_ID: com.frigyapp.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        VITE_REVENUECAT_ENTITLEMENT_ID: premium
        VITE_APPLE_BUNDLE_ID: com.frigyapp.app
        VITE_APPLE_CLIENT_ID: com.frigyapp.app
        VITE_APPLE_REDIRECT_URI: https://app.frigy.app/auth/callback
        VITE_PRIVACY_POLICY_URL: https://app.frigy.app/legal/datenschutz
        VITE_APP_WEB_HOST: app.frigy.app

    scripts:
      - name: Verify build environment
        script: bash scripts/codemagic-verify-env.sh

      - name: Install dependencies
        script: |
          set -e
          npm ci --legacy-peer-deps

      - name: Build web app (Vite → dist/)
        script: |
          set -e
          npm run build
          test -d dist || (echo "ERROR: dist/ missing after vite build" && exit 1)

      - name: Sync Capacitor iOS
        script: |
          set -e
          npx cap sync ios
          test -d ios/App/App/public || (echo "ERROR: cap sync did not copy web assets" && exit 1)
          if ! grep -q "RevenuecatPurchasesCapacitor\|purchases-capacitor" ios/App/CapApp-SPM/Package.swift; then
            echo "WARNING: RevenueCat not in CapApp-SPM — IAP may fail on device."
          fi

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Set iOS build number
        script: |
          set -e
          cd ios/App
          BUILD_NUM="${CM_BUILD_NUMBER:-1}"
          agvtool new-version -all "$BUILD_NUM"
          echo "iOS CFBundleVersion=$BUILD_NUM"

      - name: Build IPA
        script: |
          set -e
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      scripts:
        - name: Build info
          script: echo "IPA ready — download from Artifacts."

  ios-build-adhoc:
    name: iOS Build (Ad Hoc)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 22
      groups:
        - frigy
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.frigyapp.app
      vars:
        NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        XCODE_SCHEME: App
        BUNDLE_ID: com.frigyapp.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        VITE_REVENUECAT_ENTITLEMENT_ID: premium
    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build IPA
        script: |
          set -e
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
