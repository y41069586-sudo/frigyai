# Frigy — iOS Build (Capacitor). Kein Android-Workflow mehr.
# Setup: docs/CODEMAGIC.md

workflows:
  ios-build:
    name: iOS Build

    max_build_duration: 120
    instance_type: mac_mini_m2

    # Apple API: Codemagic → frigyai → Environment variables → group "appstore_credentials"
    # (all 3 APP_STORE_CONNECT_* vars must be in this group). See docs/CODEMAGIC.md
    environment:
      xcode: latest
      node: 20
      groups:
        - appstore_credentials
      vars:
        NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        XCODE_SCHEME: App
        BUNDLE_ID: com.frigyapp.app
        # Pflicht unter Environment variables (Application settings):
        # APP_STORE_CONNECT_KEY_IDENTIFIER
        # APP_STORE_CONNECT_ISSUER_ID
        # APP_STORE_CONNECT_PRIVATE_KEY  (Secret)
        # VITE_SUPABASE_URL
        # VITE_SUPABASE_PUBLISHABLE_KEY
        # VITE_REVENUECAT_API_KEY_IOS
        # VITE_REVENUECAT_ENTITLEMENT_ID=premium

    scripts:
      - name: Verify App Store Connect API env
        script: |
          set -e
          missing=""
          [ -z "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" ] && missing="$missing APP_STORE_CONNECT_KEY_IDENTIFIER"
          [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ] && missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "ERROR: Missing environment variables:$missing"
            echo ""
            echo "Fix in Codemagic (exact names, same group):"
            echo "  1. frigyai → Settings → Environment variables"
            echo "  2. Create group: appstore_credentials"
            echo "  3. Add all three variables IN that group (PRIVATE_KEY = Secret):"
            echo "     - APP_STORE_CONNECT_KEY_IDENTIFIER = BFQ5G69F89"
            echo "     - APP_STORE_CONNECT_ISSUER_ID = (UUID from App Store Connect)"
            echo "     - APP_STORE_CONNECT_PRIVATE_KEY = full .p8 file contents"
            echo ""
            echo "If you see 'unknown variable group appstore_credentials', the group name must match exactly."
            echo "See docs/CODEMAGIC.md"
            exit 1
          fi
          key_len=$(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | wc -c | tr -d ' ')
          echo "App Store Connect API OK (key_id set, issuer set, private_key ${key_len} chars)."

      - name: Install dependencies
        script: npm ci --legacy-peer-deps

      - name: Build web app (Vite → dist/)
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      # Erstellt/holt Distribution-Zertifikat + App-Store-Profil bei Apple (--create)
      - name: Fetch code signing files from Apple
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing
        script: xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Set iOS build number
        script: |
          set -e
          cd ios/App
          BUILD_NUM="${CM_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          agvtool new-version -all "$BUILD_NUM"
          echo "iOS CFBundleVersion=$BUILD_NUM"

      - name: Build IPA
        script: |
          set -e
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      scripts:
        - name: Build info
          script: |
            echo "=========================================="
            echo "  iOS: Artifacts → *.ipa"
            echo "  TestFlight: App Store Connect Integration in Codemagic aktivieren"
            echo "  docs/CODEMAGIC.md"
            echo "=========================================="

  # Optional: internes Testen auf registrierten Geräten (Ad Hoc), nicht App Store.
  # In Codemagic Ad-Hoc-Profil hinterlegen, dann diesen Workflow starten.
  ios-build-adhoc:
    name: iOS Build (Ad Hoc)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 20
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.frigyapp.app
      vars:
        NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        XCODE_SCHEME: App
        BUNDLE_ID: com.frigyapp.app
    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build IPA
        script: |
          set -e
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
