# Frigy — iOS Build (Capacitor). Kein Android-Workflow mehr.
# Setup: docs/CODEMAGIC.md

workflows:
  ios-build:
    name: iOS Build

    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      node: 20
      ios_signing:
        # Codemagic → Team settings → Code signing identities (Distribution cert + profile)
        # Für TestFlight / App Store:
        distribution_type: app_store
        bundle_identifier: com.frigyapp.app
      vars:
        NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        XCODE_SCHEME: App
        BUNDLE_ID: com.frigyapp.app
        # Pflicht in Codemagic → Environment variables (oder Variable groups):
        # VITE_SUPABASE_URL
        # VITE_SUPABASE_PUBLISHABLE_KEY
        # VITE_REVENUECAT_API_KEY_IOS
        # VITE_REVENUECAT_ENTITLEMENT_ID=premium
        # Optional: VITE_CHOTTULINK_API_KEY, VITE_APP_WEB_HOST, VITE_PRIVACY_POLICY_URL

    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps

      - name: Build web app (Vite → dist/)
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Set up code signing
        script: xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Set iOS build number
        script: |
          set -e
          cd ios/App
          BUILD_NUM="${CM_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          agvtool new-version -all "$BUILD_NUM"
          echo "iOS CFBundleVersion=$BUILD_NUM"

      - name: Build IPA
        script: |
          set -e
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      scripts:
        - name: Build info
          script: |
            echo "=========================================="
            echo "  iOS: Artifacts → *.ipa"
            echo "  TestFlight: App Store Connect Integration in Codemagic aktivieren"
            echo "  docs/CODEMAGIC.md"
            echo "=========================================="

  # Optional: internes Testen auf registrierten Geräten (Ad Hoc), nicht App Store.
  # In Codemagic Ad-Hoc-Profil hinterlegen, dann diesen Workflow starten.
  ios-build-adhoc:
    name: iOS Build (Ad Hoc)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 20
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.frigyapp.app
      vars:
        NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        XCODE_SCHEME: App
        BUNDLE_ID: com.frigyapp.app
    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build IPA
        script: |
          set -e
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
