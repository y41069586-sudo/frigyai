workflows:
  android-build:
    name: Android Build

    environment:
      vars:
         NPM_CONFIG_LEGACY_PEER_DEPS: "true"
         EXPO_TOKEN: b2TWZmLz0pJk1MgXxPR939cl3SLF8ApTxqqWoXTt

    scripts:
      - npm ci --legacy-peer-deps
      - npm install -g eas-cli
      - mkdir -p build
      - eas build --platform android --profile preview --non-interactive --wait --json > build/eas-build.json
      - node scripts/download-eas-artifact.mjs build/eas-build.json build

    artifacts:
      - build/*.apk
      - build/*.aab
   
